{% extends "base.html" %}

{% block title %}404 Not Found — CyberShield AI{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card card-cyber p-5 mx-auto" style="max-width: 550px;">
        <div class="fs-1 text-warning mb-3"><i class="bi bi-question-diamond-fill"></i></div>
        <h3 class="fw-bold text-white mb-2">Resource Not Located</h3>
        <p class="text-secondary small mb-4">
            The requested case identifier, file reference, or navigation endpoint does not exist on CyberShield.
        </p>
        <div>
            <a href="{{ url_for('index') }}" class="btn btn-outline-info me-2">Return Home</a>
            <a href="{{ url_for('cases.track_case') }}" class="btn btn-primary">Track Case Status</a>
        </div>
    </div>
</div>
{% endblock %}
